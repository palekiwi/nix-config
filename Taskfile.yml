version: '3'

tasks:
  gpg-import-keys:
    cmds:
      - gpg --import ~/nix-config/users/pl/pgp.asc

  git-hooks-sync:
    desc: Sync template git hooks into existing repos (run after hook edits)
    cmds:
      - git-hooks-sync

  sops-edit-keys:
    cmds:
      - sops secrets/secrets.yaml

  sops-stub-keys:
    vars:
      SOPS_AGE_DIR: ~/.config/sops/age
    cmds:
      - mkdir -p {{.SOPS_AGE_DIR}}
      - test -f {{.SOPS_AGE_DIR}}/keys.txt || echo "AGE-SECRET-KEY-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" > {{.SOPS_AGE_DIR}}/keys.txt

  agent-nats-leaf-seed:
    desc: (agent VM) Generate the agent-nats leaf nkey and print its public key
    summary: |
      Run inside the agent VM. Generates a NATS user nkey, writes
      NATS_LEAF_SEED=<seed> to {{.FILE}} (root, mode 0600) and prints the
      public key. Put the public key in modules/agent-nats/leaf.pub in
      nix-config, rebuild pale, then restart the agent VM (or the
      agent-nats-leaf service in it).
      An existing seed file is kept unless FORCE=1.
    vars:
      FILE: '{{.FILE | default "/var/lib/agent-nats/leaf.env"}}'
      FORCE: '{{.FORCE | default "0"}}'
    silent: true
    cmds:
      - |
        set -eu
        if sudo test -e "{{.FILE}}" && [ "{{.FORCE}}" != 1 ]; then
          echo "{{.FILE}} exists, rerun with FORCE=1 to replace it" >&2
          exit 1
        fi
        keys=$(nix shell nixpkgs#nkeys --command nk -gen user -pubout)
        seed=$(printf '%s\n' "$keys" | sed -n 1p)
        pub=$(printf '%s\n' "$keys" | sed -n 2p)
        case "$seed" in SU*) ;; *) echo "unexpected nk output" >&2; exit 1 ;; esac
        case "$pub" in U*) ;; *) echo "unexpected nk output" >&2; exit 1 ;; esac
        sudo install -d -m 0700 -o root -g root "$(dirname "{{.FILE}}")"
        printf 'NATS_LEAF_SEED=%s\n' "$seed" | sudo install -m 0600 -o root -g root /dev/stdin "{{.FILE}}"
        echo "wrote {{.FILE}}"
        echo "leaf public key: $pub"
        echo "on pale: echo $pub > modules/agent-nats/leaf.pub in nix-config, commit, rebuild pale"
        echo "then restart the agent VM, or in the VM: sudo systemctl restart agent-nats-leaf"

  home-build:
    desc: Build a home configuration with sb-scripts from a local checkout (no ssh)
    vars:
      HOST: '{{.HOST | default "pale"}}'
      SB_SCRIPTS: '{{.SB_SCRIPTS | default "/home/pl/code/spabreaks/sb-scripts"}}'
    dir: home
    cmds:
      - >-
        nix build --no-link --print-out-paths
        --override-input sb-scripts git+file://{{.SB_SCRIPTS}}
        .#homeConfigurations."pl@{{.HOST}}".activationPackage

  docs-fetch:
    desc: Fetch markdown documentation from Github URLs
    cmds:
      - fetch_gh_docs
    silent: true

  vm-sync-repo:
    desc: (host) Fast-forward a branch from the agent VM and push it to origin
    summary: |
      Fetches the `vm` remote of REPO, fast-forwards BRANCH (checked out or
      not) to vm/BRANCH and pushes it to origin. Stops when the branch has
      diverged from the VM; never merges or force-pushes. DRY=1 prints the
      commits that would move and changes nothing.
    requires:
      vars: [REPO, BRANCH]
    vars:
      DRY: '{{.DRY | default "0"}}'
    silent: true
    cmds:
      - |
        set -eu
        repo={{.REPO}}; branch={{.BRANCH}}
        if ! git -C "$repo" remote get-url vm >/dev/null 2>&1; then
          echo "$repo: no 'vm' remote; add one pointing at the same path in the guest" >&2
          exit 1
        fi
        git -C "$repo" fetch -q vm "$branch"
        local_sha=$(git -C "$repo" rev-parse "refs/heads/$branch")
        vm_sha=$(git -C "$repo" rev-parse "refs/remotes/vm/$branch")
        if [ "$local_sha" = "$vm_sha" ]; then
          echo "$repo $branch: up to date"
        elif ! git -C "$repo" merge-base --is-ancestor "$local_sha" "$vm_sha"; then
          echo "$repo $branch: diverged from vm/$branch, resolve by hand" >&2
          exit 1
        else
          git -C "$repo" log --oneline "$local_sha..$vm_sha"
          if [ "{{.DRY}}" = 1 ]; then exit 0; fi
          if [ "$(git -C "$repo" branch --show-current)" = "$branch" ]; then
            git -C "$repo" merge -q --ff-only "vm/$branch"
          else
            git -C "$repo" update-ref "refs/heads/$branch" "$vm_sha" "$local_sha"
          fi
        fi
        if [ "{{.DRY}}" != 1 ]; then git -C "$repo" push -q origin "$branch"; fi

  cue-platform-deploy:
    desc: (host) Sync cue-platform dev and config-cue from the VM and bump the input
    summary: |
      Fast-forwards and pushes cue-platform BRANCH (default dev) and the
      config-cue checked-out branch from the agent VM, then in FLAKE (default
      ~/nix-config; a worktree path also works) runs
      `nix flake update cue-platform` and commits flake.lock. It does not
      rebuild. FLAKE must have no staged changes. DRY=1 only reports what
      would move.
    vars:
      CUE_PLATFORM: '{{.CUE_PLATFORM | default "/home/pl/code/palekiwi-labs/cue-platform"}}'
      CONFIG_CUE: '{{.CONFIG_CUE | default "/home/pl/.config/cue"}}'
      BRANCH: '{{.BRANCH | default "dev"}}'
      FLAKE: '{{.FLAKE | default "/home/pl/nix-config"}}'
      DRY: '{{.DRY | default "0"}}'
      CONFIG_CUE_BRANCH:
        sh: git -C {{.CONFIG_CUE}} branch --show-current
    silent: true
    cmds:
      - task: vm-sync-repo
        vars: { REPO: '{{.CUE_PLATFORM}}', BRANCH: '{{.BRANCH}}', DRY: '{{.DRY}}' }
      - task: vm-sync-repo
        vars: { REPO: '{{.CONFIG_CUE}}', BRANCH: '{{.CONFIG_CUE_BRANCH}}', DRY: '{{.DRY}}' }
      - |
        set -eu
        if [ "{{.DRY}}" = 1 ]; then echo "dry run: skipping flake update"; exit 0; fi
        cd {{.FLAKE}}
        if ! git diff --cached --quiet; then
          echo "{{.FLAKE}}: staged changes present, commit or unstage them first" >&2
          exit 1
        fi
        nix flake update cue-platform
        if git diff --quiet -- flake.lock; then
          echo "cue-platform input unchanged"
        else
          git commit -q -m "chore: bump cue-platform" -- flake.lock
          echo "committed flake.lock"
        fi

  vm-home-switch:
    desc: (agent VM) Apply the pl@casm home configuration, repairing missing store paths
    summary: |
      Run inside the agent VM. Builds the pl@casm activation package from
      FLAKE (default ~/nix-config), re-realises store paths that the nix
      database lists but the store lacks (left behind when a host rebuild
      drops them from the system image), switches, and restarts
      cue-supervisor.
    vars:
      FLAKE: '{{.FLAKE | default "/home/pl/nix-config"}}'
    silent: true
    cmds:
      - |
        set -eu
        cd {{.FLAKE}}
        attr='.#homeConfigurations."pl@casm".activationPackage'
        gen=$(nix build --no-link --print-out-paths "$attr")
        missing=$(for p in $(nix-store -qR "$gen"); do [ -e "$p" ] || echo "$p"; done)
        if [ -n "$missing" ]; then
          echo "repairing $(echo "$missing" | wc -l) missing store paths"
          sudo nix build --repair --no-link "$attr"
        fi
        home-manager switch --flake .#pl@casm
        systemctl --user restart cue-supervisor
        systemctl --user is-active cue-supervisor

  vm-cue-platform-bump:
    desc: (agent VM) Bump the cue-platform input, commit flake.lock and apply it
    summary: |
      Run inside the agent VM, in FLAKE (default ~/nix-config). Updates the
      cue-platform input to the latest commit on GitHub, commits flake.lock
      and runs vm-home-switch. No VM rebuild. Guest-only cue-platform
      commits are not picked up until they are pushed from the host
      (cue-platform-deploy). FLAKE must have no staged changes.
    vars:
      FLAKE: '{{.FLAKE | default "/home/pl/nix-config"}}'
    silent: true
    cmds:
      - |
        set -eu
        cd {{.FLAKE}}
        if ! git diff --cached --quiet; then
          echo "{{.FLAKE}}: staged changes present, commit or unstage them first" >&2
          exit 1
        fi
        nix flake update cue-platform
        if git diff --quiet -- flake.lock; then
          echo "cue-platform input unchanged"
        else
          git commit -q -m "chore: bump cue-platform" -- flake.lock
          echo "committed flake.lock on $(git branch --show-current)"
        fi
      - task: vm-home-switch
        vars: { FLAKE: '{{.FLAKE}}' }
